<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thiết kế menu ngang</title>
    <style>
        .menu {
            list-style: none;
            text-align: center;
            padding: 0;
        }

        .menu li {
            display: inline-block;
            background-color: turquoise;
            width: 100px;
        }

        .menu li a {
            display: block;
            color: blue;
            text-decoration: underline;
            padding: 5px;
        }

        .best-shared {
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        .logo img {
            width: 200px;
        }
    </style>
</head>
<body>

    <ul class="menu">
        <li><a href="#">TMDT</a></li>
        <li><a href="#">ERP</a></li>
        <li><a href="#">MIS</a></li>
        <li><a href="#">DS</a></li>
    </ul>

</body>
</html>
