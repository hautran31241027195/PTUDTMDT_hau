<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>WThiết kế bố cục Website Layout</title>
    <style>
        * {
            box-sizing: border-box;
        }

        #wrapper {
            width: 600px;
            margin: 20px auto;
            border: 2px solid black;
            padding: 5px;
        }

        header {
            height: 45px;
            border: 2px solid black;
            margin-bottom: 5px;
            padding: 10px;
        }

        .content {
            display: flex;
            gap: 5px;
        }

        nav {
            width: 25%;
            height: 250px;
            border: 2px solid black;
            padding: 10px;
        }

        main {
            flex: 1;
            height: 250px;
            border: 2px solid black;
            padding: 10px;
        }

        footer {
            height: 35px;
            border: 2px solid black;
            margin-top: 5px;
            padding: 5px;
        }
    </style>
</head>
<body>

    <div id="wrapper">
        <header>header</header>

        <div class="content">
            <nav>nav</nav>
            <main>main</main>
        </div>

        <footer>footer</footer>
    </div>

</body>
</html>
